name: Quant Digest (riepilogo giornaliero)

on:
  schedule:
    - cron: "23 7 * * *"   # 07:23 UTC (~09:23 ora italiana): off dal top dell'ora (meno scarti)
  workflow_dispatch: {}

concurrency:
  group: quant-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leggi il registro paper-trading (sola lettura)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: quant-cache-none
          restore-keys: |
            quant-cache-

      - name: Installa il pacchetto
        run: pip install -e .

      - name: Invia il riepilogo su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python send_digest.py
