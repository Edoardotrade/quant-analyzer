name: Quant Digest (riepilogo giornaliero)

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC (~09:00 ora italiana), una volta al giorno
  workflow_dispatch: {}

concurrency:
  group: quant-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa il pacchetto
        run: pip install -e .

      - name: Invia il riepilogo su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python send_digest.py
