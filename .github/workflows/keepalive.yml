name: Keep dashboard awake

# Visita la dashboard ogni ~15 minuti così non va in standby per inattività.
# È un keep-alive best-effort sul piano gratuito di Streamlit (non una garanzia assoluta).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: quant-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping della dashboard
        run: |
          echo "Ping $(date -u)"
          curl -sS -L -o /dev/null -w "HTTP %{http_code}\n" \
            https://quant-analyzer-edoardo.streamlit.app/ || true
